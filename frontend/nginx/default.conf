# Served by nginx-unprivileged (non-root, port 8080). TLS is terminated in front of
# this container (load balancer / ingress), which also sets HSTS.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Same-origin API: the browser never talks to the backend directly, so CORS stays closed
    # and the SameSite=Strict refresh cookie just works.
    location /api/ {
        # No add_header here: the API sets its own (stricter) security headers and
        # duplicating them yields invalid values such as "X-Frame-Options: DENY, DENY".
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Backend runs with VAULTPAY_TRUSTED_PROXY_COUNT=1 and takes the LAST hop,
        # i.e. the address nginx saw - a client-supplied X-Forwarded-For can't spoof it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
