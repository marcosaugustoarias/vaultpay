# SEC-SUP-01: every push/PR runs SAST, dependency audits, secret scanning, the full test
# suites (incl. real PostgreSQL) and the control-traceability check. Least-privilege token.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaultpay
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vaultpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaultpay" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incl. flake8-bandit rules)
        run: ruff check .
      - name: SAST (bandit)
        run: bandit -r app -c pyproject.toml
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt --strict
      - name: Tests + coverage (SQLite + PostgreSQL)
        env:
          VAULTPAY_TEST_POSTGRES_URL: postgresql+psycopg://vaultpay:ci-only-password@localhost:5432/vaultpay_test
        run: pytest --cov --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-fund
      - name: Unsafe-API guard (no innerHTML/eval/Web Storage)
        run: npm run lint:security
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities (npm audit, runtime deps)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Secret scanning (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Security controls traceability (docs <-> code)
        run: python3 scripts/check_controls.py
